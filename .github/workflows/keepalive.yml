name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Buchungen abfragen
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/bookings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" > /dev/null
